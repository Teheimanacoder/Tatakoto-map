
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tatakoto Map</title>

    <!-- Bibliothèque Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f3;
        }

        header {
            background: #126b60;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        #map {
            height: 75vh;
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #555;
        }
   .filtres {
    padding: 15px;
    background: white;
    display: flex;
    align-items: center;
    gap: 12px;
}

.filtres select {
    padding: 9px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 15px;
}

#map {
    height: 75vh;
    width: 100%;
} </style>
</head>

<body>

    <header>
        <h1>🌴 Tatakoto Map</h1>
        <p>Notre carte interactive de l'atoll</p>
    </header>
<div class="filtres">
    <label for="categorie">Afficher :</label>

    <select id="categorie">
        <option value="Toutes">Toutes les catégories</option>
        <option value="Géographie">Géographie</option>
        <option value="Public">Bâtiments publics</option>
        <option value="Habitation">Habitations</option>
        <option value="Technique">Équipements techniques</option>
        <option value="Nature">Zones naturelles</option>
        <option value="Réseau">Réseau MeshCore</option>
        <option value="Transport">Transport</option>
    </select>
</div>
    <div id="map"></div>

    <footer>
        Projet numérique communautaire de Tatakoto
    </footer>

    <!-- Bibliothèque Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>




// 1. Création de la carte
const map = L.map('map').setView(
    [-17.35, -138.4],
    11
);

// 2. Fond de carte OpenStreetMap
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }
).addTo(map);

// 3. Notre répertoire géographique
const lieux = [
    {
        nom: "Atoll de Tatakoto",
        latitude: -17.34146,
        longitude: -138.40164,
        categorie: "Géographie",
        description: "Bienvenue sur notre carte interactive."
    }
];

// 4. Groupe contenant les marqueurs
const marqueurs = L.layerGroup().addTo(map);

// 5. Fonction d'affichage des lieux
function afficherLieux(categorieChoisie) {

    // On efface les anciens marqueurs
    marqueurs.clearLayers();

    // On parcourt notre répertoire
    lieux.forEach(function(lieu) {

        // On vérifie la catégorie
        if (
            categorieChoisie === "Toutes" ||
            lieu.categorie === categorieChoisie
        ) {

            const marqueur = L.marker([
                lieu.latitude,
                lieu.longitude
            ]);

            // Création de la fenêtre informative
            const contenu = document.createElement("div");

            const titre = document.createElement("h3");
            titre.textContent = lieu.nom;

            const categorie = document.createElement("p");
            categorie.textContent = "Catégorie : " + lieu.categorie;

            const description = document.createElement("p");
            description.textContent = lieu.description;

            contenu.appendChild(titre);
            contenu.appendChild(categorie);
            contenu.appendChild(description);

            marqueur.bindPopup(contenu);

            // Ajout du marqueur à la carte
            marqueur.addTo(marqueurs);
        }
    });
}

// 6. Affichage initial
afficherLieux("Toutes");

// 7. Écoute du menu déroulant
const menuCategorie = document.getElementById("categorie");

menuCategorie.addEventListener("change", function() {

    const categorieChoisie = menuCategorie.value;

    afficherLieux(categorieChoisie);

});

// 2. Ajout du fond de carte
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }
).addTo(map);

// 3. Création de notre premier lieu
const lieux = [
    {
        nom: "Atoll de Tatakoto",
        latitude: -17.34146,
        longitude: -138.40164,
        categorie: "Géographie",
        description: "Bienvenue sur notre carte interactive de Tatakoto, dans les Tuamotu."
    }
];

// 4. Affichage des lieux sur la carte
lieux.forEach(function(lieu) {

    const marqueur = L.marker([
        lieu.latitude,
        lieu.longitude
    ]).addTo(map);

    
const contenu = document.createElement("div");

const titre = document.createElement("h3");
titre.textContent = lieu.nom;

const categorie = document.createElement("p");
categorie.textContent = "Catégorie : " + lieu.categorie;

const description = document.createElement("p");
description.textContent = lieu.description;

contenu.appendChild(titre);
contenu.appendChild(categorie);
contenu.appendChild(description);

marqueur.bindPopup(contenu);


});



    </script>

</body>
</html>
